<p><b>Forms</b></p>
<form action="#" method="post">
<fieldset>
<legend>Student Registration Form</legend>
<label for="firstname">First Name:</label>
<input type="text" name="firstname" id="firstname" placeholder="Enter your first name" required>
<br><br>
<label for="lastname">Last Name:</label>
<input type="text" name="lastname" id="lastname" placeholder="Enter your last name" required>
<br><br>
<label for="username">User Name:</label>
<input type="text" name="username" id="username" placeholder="Enter your User Name" required>
<br><br>
<label for="pass">Password:</label>
<input type="password" name="pass" id="pass" placeholder="Enter your password" required>
<br><br>
<label for="mail">Email:</label>
<input type="email" name="mail" id="mail" placeholder="Enter your email" required>
<br><br>
<label for="number">Phone Number:</label>
<input type="tel" name="number" id="number" placeholder="Enter your Phone Number" required>
<br><br>
<label for="dateofbirth">Date of Birth:</label>
<input type="date" name="dateofbirth" id="dateofbirth" required>
<br><br>
<label for="gender">Gender:</label>
<select name="gender" id="gender" required>
<option value="">-- Select Gender --</option>
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other</option>
</select>
</fieldset>
<br>
<fieldset>
<legend>Academic Information</legend>
<label for="course">Course:</label>
<select name="course" id="course" required>
<option value="">-- Select Course --</option>
<option value="bbit">BBIT</option>
<option value="computerscience">Computer Science</option>
<option value="bcom">BCOM</option>
<option value="bisf">BISF</option>
<option value="engineering">Engineering</option>
<option value="law">Law</option>
</select>
<br><br>
<label for="year">Year of Study:</label>
<select name="year" id="year" required>
<option value="">-- Select Year --</option>
<option value="year1">Year 1</option>
<option value="year2">Year 2</option>
<option value="year3">Year 3</option>
<option value="year4">Year 4</option>
</select>
<br><br>
<label for="hobby">Hobbies and Interests:</label>
<select name="hobby" id="hobby" required>
<option value="">-- Select Hobby --</option>
<option value="music">Music</option>
<option value="reading">Reading</option>
<option value="programming">Programming</option>
<option value="acting">Acting</option>
</select>
<br><br>
</fieldset>
<br>
<button type="submit">Register</button>
<button type="reset">Reset</button>
</form>
</body>
